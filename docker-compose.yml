
name: explorewithme

services:
  user-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ewm_users
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-54321}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ewm_users"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  event-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ewm_events
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-54321}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - event_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ewm_events"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  request-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ewm_requests
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-54321}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - request_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ewm_requests"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  comment-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ewm_comments
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-54321}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - comment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ewm_comments"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  stats-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ewm_stats_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-54321}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - stats_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ewm_stats_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  discovery-server:
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8761'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    restart: unless-stopped
    environment:
      CONFIG_REPO: file:/config-repo
      EUREKA_CLIENT_ENABLED: "false"
    volumes:
      - ./infra/config-repo:/config-repo:ro
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8888'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  user-service:
    build:
      context: .
      dockerfile: core/user-service/Dockerfile
    restart: unless-stopped
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      POSTGRES_HOST: user-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-54321}
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/ewm_users
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-54321}
    depends_on:
      user-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - backend

  event-service:
    build:
      context: .
      dockerfile: core/event-service/Dockerfile
    restart: unless-stopped
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      POSTGRES_HOST: event-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-54321}
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-db:5432/ewm_events
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-54321}
    depends_on:
      event-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - backend

  request-service:
    build:
      context: .
      dockerfile: core/request-service/Dockerfile
    restart: unless-stopped
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      POSTGRES_HOST: request-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-54321}
      SPRING_DATASOURCE_URL: jdbc:postgresql://request-db:5432/ewm_requests
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-54321}
    depends_on:
      request-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - backend

  comment-service:
    build:
      context: .
      dockerfile: core/comment-service/Dockerfile
    restart: unless-stopped
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      POSTGRES_HOST: comment-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-54321}
      SPRING_DATASOURCE_URL: jdbc:postgresql://comment-db:5432/ewm_comments
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-54321}
    depends_on:
      comment-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - backend

  stats-server:
    build:
      context: .
      dockerfile: stats/stats-server/Dockerfile
    restart: unless-stopped
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      POSTGRES_HOST: stats-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-54321}
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/ewm_stats_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-54321}
    depends_on:
      stats-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - backend

  gateway-server:
    build:
      context: .
      dockerfile: infra/gateway-server/Dockerfile
    restart: unless-stopped
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  user_db_data:
  event_db_data:
  request_db_data:
  comment_db_data:
  stats_db_data:
