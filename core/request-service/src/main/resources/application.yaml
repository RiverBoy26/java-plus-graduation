spring:
  application:
    name: request-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 12
        initial-interval: 700
        multiplier: 1.4
        max-interval: 2500
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
