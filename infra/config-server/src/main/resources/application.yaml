server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - ${CONFIG_REPO:file:./infra/config-repo}
            - ${CONFIG_REPO:file:./infra/config-repo}/core
            - ${CONFIG_REPO:file:./infra/config-repo}/stats
            - ${CONFIG_REPO:file:./infra/config-repo}/infra