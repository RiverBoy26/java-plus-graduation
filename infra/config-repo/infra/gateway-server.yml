server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
          - Path=/admin/users,/admin/users/**

        - id: request-service
          uri: lb://request-service
          predicates:
                  - Path=/users/*/requests,/users/*/requests/**

        - id: comment-service-admin
          uri: lb://comment-service
          predicates:
            - Path=/admin/comments,/admin/comments/**

        - id: comment-service-private
          uri: lb://comment-service
          predicates:
            - Path=/users/*/comments,/users/*/comments/**

        - id: comment-service-public
          uri: lb://comment-service
          predicates:
            - Path=/events/*/comments,/events/*/comments/**

        - id: event-service-admin
          uri: lb://event-service
          predicates:
            - Path=/admin/events,/admin/events/**,/admin/categories,/admin/categories/**,/admin/compilations,/admin/compilations/**

        - id: event-service-private
          uri: lb://event-service
          predicates:
            - Path=/users/*/events,/users/*/events/**

        - id: event-service-public
          uri: lb://event-service
          predicates:
            - Path=/events,/events/**,/categories,/categories/**,/compilations,/compilations/**