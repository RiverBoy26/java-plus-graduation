server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      routes:
        - id: main-service-admin
          uri: lb://main-service
          predicates:
            - name: Path
              args:
                patterns:
                  - /admin/categories/**
                  - /admin/categories
                  - /admin/comments/**
                  - /admin/compilations/**
                  - /admin/compilations
                  - /admin/events/**
                  - /admin/events
                  - /admin/users/**
                  - /admin/users
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: main-service-private
          uri: lb://main-service
          predicates:
            - name: Path
              args:
                patterns:
                  - /users/{userId}/comments
                  - /users/{userId}/comments/**
                  - /users/{userId}/events
                  - /users/{userId}/events/**
                  - /users/{userId}/requests
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: main-service-public
          uri: lb://main-service
          predicates:
            - name: Path
              args:
                patterns:
                  - /categories
                  - /categories/**
                  - /events
                  - /events/**
                  - /compilations
                  - /compilations/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
              - http://localhost:5173
              - http://localhost:8443
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600