server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/ewm_comments
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true