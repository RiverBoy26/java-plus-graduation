server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/${POSTGRES_DB:ewm}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always