server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ewm_main_db
    username: postgres
    password: 54321
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      сontinue-on-error: true

  jpa:
    datasource-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always